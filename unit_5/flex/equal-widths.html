<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Equal Width Elements Example</title>
  <style>
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      background-color: lightgray;
    }

    .box {
      flex: 1;
      background: lightblue;
      padding: 20px;
    }


  </style>
</head>
<body>
<div class="container">
  <div class="box">Home</div>
  <div class="box">About</div>
  <div class="box">Contact</div>
</div>
</body>
</html>
