<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flex Horizonal Example</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
            background-color: lightgray;
            flex-direction: row;
            justify-content: space-between;
        }

        .box {
            background: lightblue;
            padding: 20px;
        }

    </style>
</head>
<body>
<div class="container">
    <div class="box">Home</div>
    <div class="box">About</div>
    <div class="box">Contact</div>
</div>
</body>
</html>
